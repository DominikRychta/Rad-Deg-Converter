<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Converter: Degrees ↔ Radians</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Degrees ↔ Radians Converter</h1>
        <div class="row">
            <div class="col-md-6">
                <div class="card p-4">
                    <h3 class="text-center">Degrees to Radians</h3>
                    <div class="mb-3">
                        <label for="degreesInput" class="form-label">Degrees</label>
                        <input type="number" id="degreesInput" class="form-control" placeholder="Enter degrees">
                    </div>
                    <button id="convertToRadians" class="btn btn-primary w-100">Convert</button>
                    <p class="mt-3 text-center">Radians: <span id="radiansOutput">-</span></p>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card p-4">
                    <h3 class="text-center">Radians to Degrees</h3>
                    <div class="mb-3">
                        <label for="radiansInput" class="form-label">Radians</label>
                        <input type="number" id="radiansInput" class="form-control" placeholder="Enter radians">
                    </div>
                    <button id="convertToDegrees" class="btn btn-primary w-100">Convert</button>
                    <p class="mt-3 text-center">Degrees: <span id="degreesOutput">-</span></p>
                </div>
            </div>
        </div>
    </div>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/prevod.js"></script>
</body>
</html>
